<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="container">
        <h1 id="head">Welcome to My Table People</h1>
        <div class="user"> 
            <input type="text" id="txt" placeholder="Username"><br>
        </div>

        <p class="para" id="par" value=""></p>
        <table>
            <tr>
                <td rowspan="2">A</td>
                <td>B</td>
                <td rowspan="3" id="did">D</td>
                <td colspan="2">E</td>
                <td>F</td>
            </tr>

            <tr>
                <td>C</td>
                <td rowspan="2">G</td>
                <td rowspan="2">H</td>
                <td rowspan="2">I</td>
            </tr>

            <tr>
                <td colspan="2">J</td>
            </tr>

            <tr>
                <td colspan="3">K</td>
                <td>L</td>
                <td colspan="2">M</td>
            </tr>


        </table>
        <div class="btnn">

            <label for="btn">Click the button:</label><br>
            <input type="button" value="Click Me" id="btn">

        </div>

    </div>


    <script src="main.js"></script>
</body>

</html>
